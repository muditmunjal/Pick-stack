workflows:
  # ============================================================
  # WORKFLOW 1 - run this ONCE first. It creates your signing
  # key (keystore) and gives it to you as a downloadable file.
  # Download keystore.jks + keystore-info.txt, then upload the
  # keystore in Codemagic > Teams > Code signing identities
  # (or keep them safe - you need this SAME file forever).
  # ============================================================
  generate-keystore:
    name: 1 - Generate signing keystore (run once)
    max_build_duration: 15
    instance_type: mac_mini_m2
    
    scripts:
      - name: Create keystore
        script: |
          STOREPASS=$(openssl rand -hex 12)
          keytool -genkeypair -v \
            -keystore keystore.jks \
            -alias skystack \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STOREPASS" -keypass "$STOREPASS" \
            -dname "CN=LLETMONK, OU=Games, O=LLETMONK, L=Dubai, C=AE"
          echo "Keystore password: $STOREPASS" > keystore-info.txt
          echo "Key alias: skystack" >> keystore-info.txt
          echo "SAVE BOTH FILES SOMEWHERE SAFE (Google Drive)." >> keystore-info.txt
    artifacts:
      - keystore.jks
      - keystore-info.txt

  # ============================================================
  # WORKFLOW 2 - the app build. Before running it, add these
  # environment variables in Codemagic (group name: signing):
  #   CM_KEYSTORE        = upload/paste your keystore.jks (as file)
  #   CM_KEYSTORE_PASSWORD = password from keystore-info.txt
  #   CM_KEY_ALIAS       = skystack
  # Then run - it outputs app-release.aab for Play Console.
  # ============================================================
  android-release:
    name: 2 - Build Sky Stack AAB for Play Store
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      groups:
        - signing
      java: 17
      node: 20
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Generate icons and splash screens
        script: |
          npx @capacitor/assets generate --android || true
      - name: Add Android platform
        script: |
          npx cap add android
          npx cap sync android
      - name: Set version
        script: |
          cd android
          # versionCode auto-increments per build
          sed -i "s/versionCode 1/versionCode $BUILD_NUMBER/" app/build.gradle || true
      - name: Build signed release bundle
        script: |
          echo $CM_KEYSTORE | base64 --decode > /tmp/keystore.jks 2>/dev/null || cp "$CM_KEYSTORE_PATH" /tmp/keystore.jks
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=/tmp/keystore.jks \
            -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$CM_KEYSTORE_PASSWORD
    artifacts:
      - android/app/build/outputs/bundle/release/app-release.aab
