workflows:
  generate-keystore:
    name: 1 - Generate signing keystore (run once)
    max_build_duration: 15
    instance_type: mac_mini_m2
    scripts:
      - name: Create keystore
        script: |
          STOREPASS=$(openssl rand -hex 12)
          keytool -genkeypair -v \
            -keystore keystore.jks \
            -alias skystack \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STOREPASS" -keypass "$STOREPASS" \
            -dname "CN=LLETMONK, OU=Games, O=LLETMONK, L=Dubai, C=AE"
          echo "Keystore password: $STOREPASS" > keystore-info.txt
          echo "Key alias: skystack" >> keystore-info.txt
    artifacts:
      - keystore.jks
      - keystore-info.txt

  android-release:
    name: 2 - Build Pick Stack AAB for Play Store
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - keystore_reference
      java: 17
      node: 20
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Generate icons and splash screens
        script: |
          npx @capacitor/assets generate --android || true
      - name: Add Android platform
        script: |
          npx cap add android
          npx cap sync android
      - name: Set version code
        script: |
          cd android
          sed -i.bak "s/versionCode 1/versionCode $BUILD_NUMBER/" app/build.gradle
          sed -i.bak "s/versionName \"1.0\"/versionName \"1.0.$BUILD_NUMBER\"/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle
      - name: Build signed release bundle
        script: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$CM_KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$CM_KEY_PASSWORD
    artifacts:
      - android/app/build/outputs/bundle/release/app-release.aab
