<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pick Stack</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800&display=swap">
<style>
  :root{
    --sky-top:#1a1440;
    --sky-mid:#4a2c6d;
    --sky-low:#c4527a;
    --sun:#ffb26b;
    --ink:#fff7ee;
    --ink-dim:rgba(255,247,238,.62);
  }
  :root[data-theme="dark"]{ }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--sky-top);
    font-family:'Nunito',system-ui,-apple-system,sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    user-select:none;-webkit-user-select:none;
  }
  #game{display:block;width:100vw;height:100vh}
  .hud{
    position:fixed;top:0;left:0;right:0;
    display:flex;flex-direction:column;align-items:center;
    padding-top:max(18px, env(safe-area-inset-top));
    pointer-events:none;
  }
  #score{
    font-family:'Bungee',cursive;
    font-size:clamp(44px,12vw,72px);
    line-height:1;
    text-shadow:0 4px 0 rgba(0,0,0,.25);
    opacity:0;transition:opacity .3s;
  }
  #best{
    font-weight:800;font-size:14px;letter-spacing:.04em;
    color:var(--ink-dim);margin-top:6px;
    opacity:0;transition:opacity .3s;
  }
  .overlay{
    position:fixed;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;
    background:rgba(16,10,38,.0);
    transition:opacity .35s;
  }
  .overlay.hidden{opacity:0;pointer-events:none}
  .title{
    font-family:'Bungee',cursive;
    font-size:clamp(52px,15vw,96px);
    line-height:.95;
    color:var(--ink);
    text-shadow:0 6px 0 rgba(0,0,0,.28);
  }
  .title span{display:block;color:var(--sun)}
  .tag{margin-top:18px;font-size:17px;font-weight:600;color:var(--ink-dim);max-width:280px}
  .tap{
    margin-top:34px;font-weight:800;font-size:15px;letter-spacing:.12em;
    padding:14px 30px;border-radius:999px;
    background:var(--sun);color:#3c1d10;
    box-shadow:0 5px 0 rgba(0,0,0,.28);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  @media (prefers-reduced-motion: reduce){ .tap{animation:none} }
  #over-score{
    font-family:'Bungee',cursive;
    font-size:clamp(64px,20vw,120px);line-height:1;
    color:var(--sun);
    text-shadow:0 6px 0 rgba(0,0,0,.28);
  }
  #over-label{font-weight:800;font-size:15px;letter-spacing:.1em;color:var(--ink-dim)}
  #over-best{margin-top:10px;font-weight:800;font-size:17px}
  #newbest{
    display:none;margin-top:14px;font-family:'Bungee',cursive;font-size:20px;
    color:#7dffb0;text-shadow:0 3px 0 rgba(0,0,0,.3);
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div id="score">0</div>
  <div id="best"></div>
</div>

<div class="overlay" id="start">
  <div class="title">PICK<span>STACK</span></div>
  <div class="tag">Tap to drop the block. Line it up perfectly and build to the stars.</div>
  <div class="tap">TAP TO PLAY</div>
</div>

<div class="overlay hidden" id="gameover">
  <div id="over-label">YOU STACKED</div>
  <div id="over-score">0</div>
  <div id="over-best"></div>
  <div id="newbest">★ NEW BEST ★</div>
  <div class="tap" style="margin-top:30px">TAP TO TRY AGAIN</div>
</div>

<script>
(function(){
  var canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
  var scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
  var startOv=document.getElementById('start'),overOv=document.getElementById('gameover');
  var overScore=document.getElementById('over-score'),overBest=document.getElementById('over-best'),newBest=document.getElementById('newbest');

  var W,H,DPR;
  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth;H=window.innerHeight;
    canvas.width=W*DPR;canvas.height=H*DPR;
    canvas.style.width=W+'px';canvas.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize',resize);resize();

  var BH=34;              // block height
  var state='menu';       // menu | play | drop | over
  var blocks=[],moving=null,fallers=[],pops=[];
  var score=0,best=0,cam=0,camTarget=0,dir=1,speed=2.2,perfectStreak=0,shake=0,t=0;

  try{ best=parseInt(localStorage.getItem('pickstack_best')||'0',10)||0; }catch(e){}
  function saveBest(){ try{ localStorage.setItem('pickstack_best',String(best)); }catch(e){} }
  bestEl.textContent=best>0?('BEST '+best):'';

  // --- tiny sounds (WebAudio, no assets) ---
  var AC=null;
  function beep(freq,dur,type,vol){
    try{
      AC=AC||new (window.AudioContext||window.webkitAudioContext)();
      if(AC.state==='suspended')AC.resume();
      var o=AC.createOscillator(),g=AC.createGain();
      o.type=type||'triangle';o.frequency.value=freq;
      g.gain.setValueAtTime(vol||0.12,AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+(dur||0.12));
      o.connect(g);g.connect(AC.destination);
      o.start();o.stop(AC.currentTime+(dur||0.12));
    }catch(e){}
  }

  function blockColor(i){
    var hue=(18+i*9)%360;
    return 'hsl('+hue+',72%,'+(58- (i%2)*6)+'%)';
  }
  function blockSide(i){
    var hue=(18+i*9)%360;
    return 'hsl('+hue+',72%,40%)';
  }

  function baseWidth(){ return Math.min(W*0.62,280); }

  function reset(){
    blocks=[];fallers=[];pops=[];
    score=0;cam=0;camTarget=0;speed=2.2;perfectStreak=0;shake=0;
    var w=baseWidth();
    blocks.push({x:(W-w)/2,w:w,i:0});
    spawn();
    scoreEl.textContent='0';
  }

  function spawn(){
    var top=blocks[blocks.length-1];
    dir=(blocks.length%2===0)?1:-1;
    moving={
      x:dir===1?-top.w:W,
      w:top.w,
      i:blocks.length,
      y:0 // computed from index
    };
  }

  function blockY(i){ return H*0.78 - i*BH; }

  function drop(){
    var top=blocks[blocks.length-1];
    var mx=moving.x, tw=top.x, overlapStart=Math.max(mx,top.x), overlapEnd=Math.min(mx+moving.w,top.x+top.w);
    var overlap=overlapEnd-overlapStart;

    if(overlap<=4){
      // total miss
      fallers.push({x:mx,w:moving.w,y:blockY(moving.i)+cam,vy:0,vr:(Math.random()-.5)*0.1,r:0,i:moving.i});
      moving=null;
      gameOver();
      return;
    }

    var delta=Math.abs(mx-top.x);
    if(delta<=7){
      // PERFECT — snap, keep width, small reward growth
      perfectStreak++;
      var grow=Math.min(perfectStreak*4,20);
      var nw=Math.min(moving.w+grow,baseWidth());
      var nx=top.x-(nw-moving.w)/2;
      nx=Math.max(8,Math.min(nx,W-nw-8));
      blocks.push({x:nx,w:nw,i:moving.i,flash:1});
      pops.push({x:nx+nw/2,y:blockY(moving.i)+cam,life:1,perfect:true,streak:perfectStreak});
      beep(520+perfectStreak*80,0.14,'triangle',0.16);
      shake=0;
    }else{
      perfectStreak=0;
      // slice: keep overlap, cut off the rest
      var cutX = (mx<top.x)? mx : overlapEnd;
      var cutW = moving.w-overlap;
      fallers.push({x:cutX,w:cutW,y:blockY(moving.i)+cam,vy:0,vr:(Math.random()-.5)*0.12,r:0,i:moving.i});
      blocks.push({x:overlapStart,w:overlap,i:moving.i});
      beep(300,0.08,'square',0.07);
    }

    score++;
    scoreEl.textContent=score;
    speed=2.2+Math.min(score*0.055,3.4);
    camTarget=Math.max(0,(blocks.length-1)*BH - H*0.28);
    spawn();
  }

  function gameOver(){
    state='over';
    beep(160,0.35,'sawtooth',0.1);
    var isNew=score>best;
    if(isNew){best=score;saveBest();}
    overScore.textContent=score;
    overBest.textContent='BEST '+best;
    newBest.style.display=isNew&&score>0?'block':'none';
    setTimeout(function(){overOv.classList.remove('hidden');},450);
  }

  function tap(){
    if(state==='menu'){
      state='play';
      startOv.classList.add('hidden');
      scoreEl.style.opacity=1;bestEl.style.opacity=1;
      bestEl.textContent=best>0?('BEST '+best):'';
      reset();
      beep(440,0.1,'triangle',0.1);
    }else if(state==='play'){
      drop();
    }else if(state==='over'&&!overOv.classList.contains('hidden')){
      state='play';
      overOv.classList.add('hidden');
      reset();
    }
  }
  window.addEventListener('pointerdown',tap);
  window.addEventListener('keydown',function(e){ if(e.code==='Space'||e.code==='Enter'){e.preventDefault();tap();} });

  // --- stars ---
  var stars=[];
  for(var s=0;s<70;s++)stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.4+0.4,tw:Math.random()*6.28});

  function draw(){
    t+=0.016;
    // camera easing
    cam+=(camTarget-cam)*0.08;
    if(shake>0)shake*=0.85;

    var climb=Math.min(cam/900,1); // 0 → 1 as you climb: sky darkens

    // sky
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, climb>0.5?'#0b0824':'#1a1440');
    g.addColorStop(0.55,'#4a2c6d');
    g.addColorStop(1,'#c4527a');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

    // sun sinking as you climb
    var sunY=H*0.72+cam*0.35;
    if(sunY<H+80){
      var sg=ctx.createRadialGradient(W/2,sunY,10,W/2,sunY,140);
      sg.addColorStop(0,'rgba(255,178,107,0.95)');
      sg.addColorStop(1,'rgba(255,178,107,0)');
      ctx.fillStyle=sg;ctx.beginPath();ctx.arc(W/2,sunY,140,0,6.29);ctx.fill();
      ctx.fillStyle='#ffb26b';ctx.beginPath();ctx.arc(W/2,sunY,42,0,6.29);ctx.fill();
    }

    // stars fade in with height
    var sa=Math.min(climb*1.4,0.9);
    if(sa>0.02){
      ctx.fillStyle='#fff';
      for(var i=0;i<stars.length;i++){
        var st=stars[i];
        ctx.globalAlpha=sa*(0.4+0.6*Math.abs(Math.sin(t+st.tw)));
        ctx.beginPath();ctx.arc(st.x*W,st.y*H,st.r,0,6.29);ctx.fill();
      }
      ctx.globalAlpha=1;
    }

    ctx.save();
    var sx=shake>0.3?(Math.random()-.5)*shake:0;
    ctx.translate(sx,cam);

    // ground
    ctx.fillStyle='#2a1633';
    ctx.fillRect(0,blockY(0)+BH,W,H);

    // stacked blocks
    for(var b=0;b<blocks.length;b++){
      var bl=blocks[b],y=blockY(bl.i);
      if(y+cam>H+BH||y+cam<-BH*2)continue;
      ctx.fillStyle=blockSide(bl.i);
      ctx.fillRect(bl.x,y,bl.w,BH);
      ctx.fillStyle=blockColor(bl.i);
      ctx.fillRect(bl.x,y,bl.w,BH-7);
      if(bl.flash&&bl.flash>0){
        ctx.fillStyle='rgba(255,255,255,'+bl.flash*0.8+')';
        ctx.fillRect(bl.x,y,bl.w,BH);
        bl.flash-=0.06;
      }
    }

    // moving block
    if(state==='play'&&moving){
      moving.x+=speed*dir;
      if(dir===1&&moving.x+moving.w>W-4){dir=-1;}
      if(dir===-1&&moving.x<4){dir=1;}
      var my=blockY(moving.i);
      ctx.fillStyle=blockSide(moving.i);
      ctx.fillRect(moving.x,my,moving.w,BH);
      ctx.fillStyle=blockColor(moving.i);
      ctx.fillRect(moving.x,my,moving.w,BH-7);
    }

    // falling cut pieces
    for(var f=fallers.length-1;f>=0;f--){
      var fa=fallers[f];
      fa.vy+=0.6;fa.y+=fa.vy;fa.r+=fa.vr;
      ctx.save();
      ctx.translate(fa.x+fa.w/2,fa.y-cam+BH/2);
      ctx.rotate(fa.r);
      ctx.globalAlpha=0.9;
      ctx.fillStyle=blockColor(fa.i);
      ctx.fillRect(-fa.w/2,-BH/2,fa.w,BH);
      ctx.restore();ctx.globalAlpha=1;
      if(fa.y-cam>H+120)fallers.splice(f,1);
    }
    ctx.restore();

    // perfect pop text
    for(var p=pops.length-1;p>=0;p--){
      var po=pops[p];
      po.life-=0.02;po.y-=0.8;
      if(po.life<=0){pops.splice(p,1);continue;}
      ctx.globalAlpha=Math.max(po.life,0);
      ctx.fillStyle='#7dffb0';
      ctx.font='800 '+(po.streak>1?22:18)+'px Nunito, sans-serif';
      ctx.textAlign='center';
      ctx.fillText(po.streak>1?'PERFECT x'+po.streak:'PERFECT!',po.x,po.y-cam- (1-po.life)*30);
      ctx.globalAlpha=1;
    }

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
